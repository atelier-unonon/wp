<script>
(function(){
  var box = document.getElementById('cards');
  if(!box) return;
  var cards = Array.prototype.slice.call(box.children);
  var armed = false;
  function armReveal(){
    if(armed) return; armed = true;
    if('IntersectionObserver' in window){
      var io = new IntersectionObserver(function(es){
        es.forEach(function(e){
          if(e.isIntersecting){
            var idx = cards.indexOf(e.target);
            setTimeout(function(){ e.target.classList.add('in'); }, (idx % 6) * 90);
            io.unobserve(e.target);
          }
        });
      }, {rootMargin: '0px 0px -6% 0px'});
      cards.forEach(function(card){ io.observe(card); });
    } else {
      cards.forEach(function(card, idx){
        setTimeout(function(){ card.classList.add('in'); }, 90 + idx * 90);
      });
    }
  }
  function layout(){
    var n = window.innerWidth >= 1150 ? 5 : window.innerWidth >= 900 ? 4 : window.innerWidth >= 640 ? 3 : window.innerWidth >= 340 ? 2 : 1;
    box.innerHTML = '';
    var cols = [], heights = [];
    for(var i=0;i<n;i++){ var c = document.createElement('div'); c.className='col'; box.appendChild(c); cols.push(c); heights.push(0); }
    cards.forEach(function(card){
      var k = 0; for(var i=1;i<n;i++) if(heights[i] < heights[k]) k = i;
      cols[k].appendChild(card); heights[k] = cols[k].offsetHeight;
    });
    armReveal();
  }
  var t; window.addEventListener('resize', function(){ clearTimeout(t); t = setTimeout(layout, 150); });
  window.addEventListener('load', layout);
  layout();
})();
</script>
